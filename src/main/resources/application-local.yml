app:
  auth:
    dev-token-enabled: true
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
  jwt:
    secret: ${JWT_SECRET:change-this-local-secret-at-least-32-bytes-long}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inning_log}
    username: ${SPRING_DATASOURCE_USERNAME:inning_user}
    password: ${SPRING_DATASOURCE_PASSWORD:inning_password}
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:true}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
