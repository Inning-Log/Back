spring:
  application:
    name: Inning-Log
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:false}
      file: compose.yaml
  flyway:
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    dispatch:
      batch-size: ${FIREBASE_DISPATCH_BATCH_SIZE:100}
      max-dispatches-per-tick: ${FIREBASE_DISPATCH_MAX_PER_TICK:20}
      max-attempts: ${FIREBASE_DISPATCH_MAX_ATTEMPTS:5}
      initial-backoff: ${FIREBASE_DISPATCH_INITIAL_BACKOFF:10s}
      max-backoff: ${FIREBASE_DISPATCH_MAX_BACKOFF:1h}
      claim-lease: ${FIREBASE_DISPATCH_CLAIM_LEASE:5m}
      fixed-delay: ${FIREBASE_DISPATCH_FIXED_DELAY:5s}
      initial-delay: ${FIREBASE_DISPATCH_INITIAL_DELAY:10s}
  auth:
    dev-token-enabled: ${APP_AUTH_DEV_TOKEN_ENABLED:false}
    refresh-token-expiration: ${APP_AUTH_REFRESH_TOKEN_EXPIRATION:30d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    issuer: ${JWT_ISSUER:inning-log}
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1h}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
      issuers:
        - https://accounts.google.com
        - accounts.google.com

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,metrics
