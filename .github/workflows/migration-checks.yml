name: Migration checks

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  upgrade:
    name: PostgreSQL upgrade from deployed migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: migration_test
          POSTGRES_PASSWORD: migration_test
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_test -d migration_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Find latest verified deployment metadata
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // A workflow's green status alone is insufficient. Only accept our post-readiness artifact.
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'deploy-ec2.yml', status: 'success', per_page: 100
            });
            for (const run of runs.data.workflow_runs) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: run.id
              });
              const artifact = artifacts.data.artifacts.find(a => a.name === 'verified-deployment' && !a.expired);
              if (!artifact) continue;
              const zip = await github.rest.actions.downloadArtifact({
                ...context.repo, artifact_id: artifact.id, archive_format: 'zip'
              });
              fs.writeFileSync('verified-deployment.zip', Buffer.from(zip.data));
              fs.writeFileSync('verified-deployment.sha', run.head_sha);
              core.info(`Using verified deployment run ${run.id}, commit ${run.head_sha}`);
              return;
            }
            core.info('No retained verified artifact. Using the explicitly recorded bootstrap baseline.');
      - name: Prepare historical migrations
        run: |
          python3 scripts/deploy/prepare-baseline.py
          BASELINE_SHA=$(cat migration-baseline.sha)
          git cat-file -e "$BASELINE_SHA^{commit}" || git fetch origin "$BASELINE_SHA"
          mkdir -p "$RUNNER_TEMP/migration-baseline"
          git archive "$BASELINE_SHA" src/main/resources/db/migration \
            | tar -x -C "$RUNNER_TEMP/migration-baseline"
      - name: Test deployment orchestration
        run: python3 -m unittest discover -s scripts/deploy/tests -v
      - name: Test migration upgrade
        env:
          MIGRATION_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/migration_test
          MIGRATION_TEST_DB_USER: migration_test
          MIGRATION_TEST_DB_PASSWORD: migration_test
          MIGRATION_BASELINE_DIR: ${{ runner.temp }}/migration-baseline/src/main/resources/db/migration
        run: |
          chmod +x gradlew
          ./gradlew test --tests 'com.inninglog.ops.*' --no-daemon
