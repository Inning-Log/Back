name: Deploy to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

env:
  IMAGE_TAR: inning-log-${{ github.sha }}.tar


jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon


  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME || 'inning-log' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$IMAGE_NAME:${{ github.sha }}" .

      - name: Save image as artifact
        run: docker save "$IMAGE_NAME:${{ github.sha }}" -o "$IMAGE_TAR"

      - name: Show image tar size
        run: ls -lh "$IMAGE_TAR"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ env.IMAGE_TAR }}
          retention-days: 1


  deploy:
    name: Deploy on EC2
    runs-on: ubuntu-latest
    needs: build-image

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME || 'inning-log' }}
      CONTAINER_NAME: ${{ secrets.DOCKER_CONTAINER_NAME || 'inning-log' }}
      APP_PORT: ${{ secrets.APP_PORT || '8080' }}

      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_PORT: ${{ secrets.EC2_PORT || '22' }}

      APP_BIND_ADDRESS: ${{ secrets.APP_BIND_ADDRESS || '127.0.0.1' }}
      APP_HOST_PORT: ${{ secrets.APP_HOST_PORT || '8080' }}
      MANAGEMENT_HOST_PORT: ${{ secrets.MANAGEMENT_HOST_PORT || '9090' }}
      MANAGEMENT_PORT: ${{ secrets.MANAGEMENT_PORT || '9090' }}
      CONTAINER_MEMORY: ${{ secrets.CONTAINER_MEMORY || '640m' }}
      CONTAINER_MEMORY_SWAP: ${{ secrets.CONTAINER_MEMORY_SWAP || '896m' }}
      CONTAINER_PIDS_LIMIT: ${{ secrets.CONTAINER_PIDS_LIMIT || '256' }}

      EC2_ENV_FILE: ${{ secrets.EC2_ENV_FILE || '/etc/inninglog/inninglog.env' }}
      EC2_FIREBASE_CREDENTIALS_FILE: ${{ secrets.EC2_FIREBASE_CREDENTIALS_FILE || '/etc/inninglog/firebase-admin.json' }}
      REMOTE_DEPLOY_DIR: ${{ secrets.REMOTE_DEPLOY_DIR || '/home/ubuntu/deploy' }}

      AWS_REGION: ${{ secrets.AWS_REGION || 'ap-northeast-2' }}
      BACKEND_SECURITY_GROUP_ID: ${{ secrets.BACKEND_SECURITY_GROUP_ID }}

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Open SSH for GitHub Actions runner
        id: open_ssh
        run: |
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '\n')
          RUNNER_CIDR="${RUNNER_IP}/32"

          echo "runner_cidr=$RUNNER_CIDR" >> "$GITHUB_OUTPUT"
          echo "Opening SSH access for $RUNNER_CIDR"

          set +e

          OUTPUT=$(aws ec2 authorize-security-group-ingress \
            --group-id "$BACKEND_SECURITY_GROUP_ID" \
            --ip-permissions \
            "IpProtocol=tcp,FromPort=$EC2_PORT,ToPort=$EC2_PORT,IpRanges=[{CidrIp=$RUNNER_CIDR,Description=github-actions-$GITHUB_RUN_ID}]" \
            2>&1)

          STATUS=$?

          set -e

          if [ $STATUS -ne 0 ]; then
            if echo "$OUTPUT" | grep -q "InvalidPermission.Duplicate"; then
              echo "SSH rule already exists for $RUNNER_CIDR"
            else
              echo "$OUTPUT"
              exit $STATUS
            fi
          fi

          sleep 5


      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" \
            | tr -d '\r' \
            > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          for i in $(seq 1 10); do
            if ssh-keyscan \
              -p "$EC2_PORT" \
              "$EC2_HOST" \
              >> ~/.ssh/known_hosts 2>/dev/null; then
              exit 0
            fi

            echo "ssh-keyscan failed. retry $i..."
            sleep 3
          done

          echo "ssh-keyscan failed after retries"
          exit 1


      - name: Check EC2 env file
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -p "$EC2_PORT" \
            "$EC2_USER@$EC2_HOST" \
            "test -f '$EC2_ENV_FILE' \
            && if grep -Eiq '^[[:space:]]*FIREBASE_ENABLED[[:space:]]*=[[:space:]]*\"?true\"?[[:space:]]*$' '$EC2_ENV_FILE'; then \
                 test -f '$EC2_FIREBASE_CREDENTIALS_FILE'; \
               fi"


      # 배포 전에 과거 tar / 사용하지 않는 Docker 이미지 정리.
      # 정지 컨테이너는 이미지를 계속 붙잡아 작은 루트 볼륨을 고갈시키므로
      # 자동 삭제하지 않고 명시적으로 실패시켜 운영자가 대상을 확인하게 한다.
      - name: Prepare remote deploy directory
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -p "$EC2_PORT" \
            "$EC2_USER@$EC2_HOST" \
            "mkdir -p '$REMOTE_DEPLOY_DIR' \
            && rm -f '$REMOTE_DEPLOY_DIR'/inning-log-*.tar \
            && if [ -n \"\$(docker ps -aq --filter status=exited)\" ]; then \
                 echo 'Stopped containers pin Docker images. Review and remove them before deployment:'; \
                 docker ps -a --filter status=exited --format 'table {{.Names}}\\t{{.Status}}\\t{{.Image}}'; \
                 exit 1; \
               fi \
            && if ! swapon --show=NAME --noheadings | grep -qx '/swapfile'; then \
                 echo 'Required emergency swap /swapfile is not active'; \
                 exit 1; \
               fi \
            && docker image prune -af \
            && AVAILABLE_KB=\$(df -Pk '$REMOTE_DEPLOY_DIR' | awk 'NR == 2 { print \$4 }') \
            && if [ \"\$AVAILABLE_KB\" -lt 1200000 ]; then \
                 echo \"Insufficient free disk for streamed image load: \$AVAILABLE_KB KiB available\"; \
                 exit 1; \
               fi \
            && echo '=== Disk usage before deployment ===' \
            && df -h '$REMOTE_DEPLOY_DIR' \
            && echo '=== Docker disk usage ===' \
            && docker system df"


      # 원격에 image tar를 저장하면 기존 이미지 + tar + 새 이미지가 동시에
      # 루트 볼륨을 차지한다. gzip 스트림으로 바로 docker load하여 peak 사용량을 줄인다.
      - name: Stream image to EC2 and load
        run: |
          set -o pipefail
          gzip -1 -c "$IMAGE_TAR" \
          | ssh \
            -i ~/.ssh/ec2_key \
            -p "$EC2_PORT" \
            "$EC2_USER@$EC2_HOST" \
            "gzip -dc | docker load \
            && echo '=== Disk usage after docker load ===' \
            && df -h '$REMOTE_DEPLOY_DIR'"


      - name: Stop previous container
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -p "$EC2_PORT" \
            "$EC2_USER@$EC2_HOST" \
            "docker stop '$CONTAINER_NAME' 2>/dev/null || true; \
            docker rm '$CONTAINER_NAME' 2>/dev/null || true"


      - name: Start new container
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -p "$EC2_PORT" \
            "$EC2_USER@$EC2_HOST" \
            "if grep -Eiq '^[[:space:]]*FIREBASE_ENABLED[[:space:]]*=[[:space:]]*\"?true\"?[[:space:]]*$' '$EC2_ENV_FILE'; then \
               docker run -d \
                 --name '$CONTAINER_NAME' \
                 --restart unless-stopped \
                 --memory '$CONTAINER_MEMORY' \
                 --memory-swap '$CONTAINER_MEMORY_SWAP' \
                 --pids-limit '$CONTAINER_PIDS_LIMIT' \
                 --env-file '$EC2_ENV_FILE' \
                 --env 'MANAGEMENT_SERVER_ADDRESS=0.0.0.0' \
                 --env 'MANAGEMENT_SERVER_PORT=$MANAGEMENT_PORT' \
                 --mount 'type=bind,src=$EC2_FIREBASE_CREDENTIALS_FILE,dst=/run/secrets/firebase-admin.json,readonly' \
                 -p '$APP_BIND_ADDRESS:$APP_HOST_PORT:$APP_PORT' \
                 -p '127.0.0.1:$MANAGEMENT_HOST_PORT:$MANAGEMENT_PORT' \
                 '$IMAGE_NAME:${{ github.sha }}'; \
             else \
               docker run -d \
                 --name '$CONTAINER_NAME' \
                 --restart unless-stopped \
                 --memory '$CONTAINER_MEMORY' \
                 --memory-swap '$CONTAINER_MEMORY_SWAP' \
                 --pids-limit '$CONTAINER_PIDS_LIMIT' \
                 --env-file '$EC2_ENV_FILE' \
                 --env 'MANAGEMENT_SERVER_ADDRESS=0.0.0.0' \
                 --env 'MANAGEMENT_SERVER_PORT=$MANAGEMENT_PORT' \
                 -p '$APP_BIND_ADDRESS:$APP_HOST_PORT:$APP_PORT' \
                 -p '127.0.0.1:$MANAGEMENT_HOST_PORT:$MANAGEMENT_PORT' \
                 '$IMAGE_NAME:${{ github.sha }}'; \
             fi"


      - name: Health check
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -p "$EC2_PORT" \
            "$EC2_USER@$EC2_HOST" \
            "for i in \$(seq 1 20); do \
              if curl -fsS \
                http://127.0.0.1:$APP_HOST_PORT/api/health \
                && curl -fsS \
                http://127.0.0.1:$MANAGEMENT_HOST_PORT/actuator/health; then \
                echo; \
                echo 'Application and management health checks passed'; \
                exit 0; \
              fi; \
              echo \"Health check attempt \$i failed\"; \
              sleep 3; \
            done; \
            echo 'Health check failed'; \
            docker logs --tail 100 '$CONTAINER_NAME'; \
            exit 1"


      # 현재 실행 중인 컨테이너가 사용하지 않는 과거 이미지 제거
      - name: Cleanup remote temporary files
        if: always()
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -p "$EC2_PORT" \
            "$EC2_USER@$EC2_HOST" \
            "rm -f '$REMOTE_DEPLOY_DIR/$IMAGE_TAR'; \
            docker image prune -af; \
            echo '=== Disk usage after cleanup ==='; \
            df -h '$REMOTE_DEPLOY_DIR'; \
            echo '=== Docker disk usage after cleanup ==='; \
            docker system df" \
            || true


      - name: Close SSH for GitHub Actions runner
        if: always()
        run: |
          RUNNER_CIDR="${{ steps.open_ssh.outputs.runner_cidr }}"

          if [ -z "$RUNNER_CIDR" ]; then
            echo "No runner CIDR found. Skip closing SSH rule."
            exit 0
          fi

          echo "Closing SSH access for $RUNNER_CIDR"

          aws ec2 revoke-security-group-ingress \
            --group-id "$BACKEND_SECURITY_GROUP_ID" \
            --protocol tcp \
            --port "$EC2_PORT" \
            --cidr "$RUNNER_CIDR" \
            || true
